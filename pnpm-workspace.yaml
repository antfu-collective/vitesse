minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  # Workbox's pinned OMT release lacks provenance; Vitest uses the same exception.
  # https://github.com/vitest-dev/vitest/blob/main/pnpm-workspace.yaml
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1'
  # Legacy semver releases predate provenance support on the v6 release line.
  # https://github.com/npm/node-semver/issues/886
  - semver@6.3.1

shellEmulator: true
packages: []

onlyBuiltDependencies:
  - cypress
  - esbuild
  - simple-git-hooks

catalogs:

  build:
    '@intlify/unplugin-vue-i18n': ^11.2.5
    '@shikijs/markdown-exit': ^4.5.0
    '@unocss/eslint-config': ^66.10.5
    '@vitejs/plugin-vue': ^6.0.9
    beasties: ^0.5.4
    markdown-it-link-attributes: ^4.0.1
    rollup: ^4.64.0
    shiki: ^4.5.0
    unocss: ^66.10.5
    unplugin: ^3.4.0
    unplugin-auto-import: ^21.1.0
    unplugin-vue-components: ^32.1.0
    unplugin-vue-markdown: ^32.1.1
    vite: ^8.3.3
    vite-bundle-visualizer: ^1.2.1
    vite-plugin-inspect: ^11.4.1
    vite-plugin-pwa: ^2.0.0
    vite-plugin-vue-devtools: ^8.2.1
    vite-plugin-vue-layouts: ^0.11.0
    vite-ssg: ^28.3.0
    vite-ssg-sitemap: ^0.10.0
    vue-macros: ^3.1.4
    workbox-build: ^7.4.1
    workbox-window: ^7.4.1

  dev:
    '@antfu/eslint-config': ^9.5.1
    '@iconify-json/carbon': ^1.2.28
    '@typescript-eslint/typescript-estree': ^8.71.1
    '@vue-macros/volar': ^3.1.4
    '@vue/test-utils': ^2.5.1
    cypress: ^16.1.1
    cypress-vite: ^1.10.2
    eslint: ^10.12.0
    eslint-plugin-cypress: ^7.0.2
    eslint-plugin-format: ^2.0.1
    https-localhost: ^4.7.2
    jsdom: ^30.1.2
    lint-staged: ^17.6.0
    simple-git-hooks: ^2.14.0
    taze: ^21.3.0
    typescript: ^6.0.3
    vitest: ^5.0.3
    vue-tsc: ^3.3.12

  frontend:
    '@unhead/vue': ^2.1.17
    '@unocss/reset': ^66.10.5
    '@vue/devtools-api': ^8.2.1
    '@vueuse/core': ^15.0.0
    nprogress: ^0.2.0
    pinia: ^4.0.3
    vue: ^3.5.43
    vue-i18n: ^11.4.13
    vue-router: ^5.3.1

  types:
    '@types/markdown-it-link-attributes': ^3.0.5
    '@types/nprogress': ^0.2.3
